<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Magnification — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 1.5rem;
        }
        #output {
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
        }
        .controls {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        label {
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="range"] {
            width: 200px;
            accent-color: #6c5ce7;
        }
        #alpha-val {
            font-variant-numeric: tabular-nums;
            min-width: 3ch;
            text-align: right;
            color: #6c5ce7;
            font-weight: 700;
        }
        button {
            padding: 0.5rem 1.2rem;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background: #2a2a4e; }
        #status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
        }
        .error { color: #e74c3c !important; }
        #debug-log {
            margin-top: 1rem;
            width: 600px;
            max-width: 90vw;
            height: 200px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #0f0;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 0.5rem;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Video Motion Magnification</h1>
    <p class="subtitle">Ha et al. 2024 — WebGPU accelerated</p>

    <canvas id="output" width="480" height="360"></canvas>

    <div class="controls">
        <label for="alpha">&alpha;</label>
        <input type="range" id="alpha" min="1" max="100" value="20" step="1">
        <span id="alpha-val">20&times;</span>
        <button id="toggle">Pause</button>
        <button id="copy-log">Copy Log</button>
    </div>
    <p id="status">Initializing WebGPU...</p>
    <div id="debug-log"></div>

    <script type="module">
        // ── Debug log capture ──
        const debugEl = document.getElementById('debug-log');
        const logLines = [];
        function dbg(msg) {
            const ts = new Date().toISOString().slice(11, 23);
            const line = `[${ts}] ${msg}`;
            logLines.push(line);
            debugEl.textContent = logLines.join('\n');
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        // Intercept console.log/warn/error/info
        for (const level of ['log', 'info', 'warn', 'error']) {
            const orig = console[level].bind(console);
            console[level] = (...args) => {
                orig(...args);
                dbg(`[${level}] ${args.map(a => {
                    try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
                    catch { return String(a); }
                }).join(' ')}`);
            };
        }

        // Capture unhandled errors and rejections
        window.addEventListener('error', e => {
            dbg(`[UNCAUGHT] ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`);
        });
        window.addEventListener('unhandledrejection', e => {
            dbg(`[UNHANDLED PROMISE] ${e.reason}`);
        });

        // Copy log button
        document.getElementById('copy-log').addEventListener('click', () => {
            navigator.clipboard.writeText(logLines.join('\n')).then(() => {
                document.getElementById('copy-log').textContent = 'Copied!';
                setTimeout(() => document.getElementById('copy-log').textContent = 'Copy Log', 1500);
            }, () => {
                // Fallback for no clipboard API
                const ta = document.createElement('textarea');
                ta.value = logLines.join('\n');
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                document.getElementById('copy-log').textContent = 'Copied!';
                setTimeout(() => document.getElementById('copy-log').textContent = 'Copy Log', 1500);
            });
        });

        // ── Main init ──
        async function init() {
            const status = document.getElementById('status');

            dbg('Page loaded, checking WebGPU...');
            dbg(`navigator.gpu: ${!!navigator.gpu}`);
            dbg(`userAgent: ${navigator.userAgent}`);

            if (!navigator.gpu) {
                const msg = 'WebGPU not supported in this browser. Try Chrome 113+ or Edge 113+.';
                status.textContent = msg;
                status.classList.add('error');
                dbg(msg);
                return;
            }

            try {
                dbg('WebGPU detected. Importing WASM module...');
                const wasm = await import('./motion_mag_webgpu.js');
                dbg('WASM JS module loaded. Calling default() to init WASM...');
                await wasm.default();
                dbg('WASM initialized successfully.');

                status.textContent = 'Running — motion magnification active';

                const slider = document.getElementById('alpha');
                const alphaVal = document.getElementById('alpha-val');
                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    alphaVal.textContent = v + '\u00d7';
                    if (window.setMagnification) window.setMagnification(v);
                });

                const toggle = document.getElementById('toggle');
                toggle.addEventListener('click', () => {
                    if (window.toggleMagnification) window.toggleMagnification();
                    toggle.textContent = toggle.textContent === 'Pause' ? 'Resume' : 'Pause';
                });

            } catch (e) {
                const msg = `Error: ${e.message || e}`;
                status.textContent = msg;
                status.classList.add('error');
                dbg(`[CATCH] ${msg}`);
                dbg(`[STACK] ${e.stack || 'no stack'}`);
            }
        }

        init();
    </script>
</body>
</html>
