[package]
name = "motion-mag-webgpu"
version = "0.1.0"
edition = "2021"
description = "Real-time video motion magnification via WebGPU (Ha et al. 2024 architecture)"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
    "CanvasRenderingContext2d",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
]

[features]
# Enable native GPU backend for cargo test (not used in WASM build)
native-test = ["wgpu/vulkan"]

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
