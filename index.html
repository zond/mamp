<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Magnification — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
        #output {
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            width: 100%;
            max-width: 100%;
            cursor: pointer;
        }
        .controls {
            margin-top: 0.75rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            width: 100%;
        }
        .slider-group input[type="range"] { flex: 1; min-width: 0; }
        label { font-size: 0.9rem; color: #aaa; white-space: nowrap; }
        input[type="range"] { accent-color: #6c5ce7; }
        #alpha-val {
            font-variant-numeric: tabular-nums;
            min-width: 3ch;
            text-align: right;
            color: #6c5ce7;
            font-weight: 700;
        }
        button, select {
            padding: 0.5rem 1rem;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button:hover, select:hover { background: #2a2a4e; }
        select { max-width: 200px; }
        #status { margin-top: 1rem; font-size: 0.8rem; color: #666; }
        .error { color: #e74c3c !important; }
        #debug-log {
            margin-top: 1rem;
            width: 600px;
            max-width: 90vw;
            height: 150px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #0f0;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 0.5rem;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Video Motion Magnification</h1>
    <p class="subtitle">Phase-Based Motion Magnification — WebGPU</p>

    <canvas id="output" width="480" height="360"></canvas>

    <div class="controls" style="flex-wrap:nowrap;">
        <label for="camera">Camera</label>
        <select id="camera" style="flex:1;min-width:0;"><option value="">Loading...</option></select>
        <label for="resolution">Res</label>
        <select id="resolution"></select>
        <label for="quality">Quality</label>
        <select id="quality">
            <option value="2,2">Fast (2s2o)</option>
            <option value="3,2">Good (3s2o)</option>
            <option value="3,4" selected>Best (3s4o)</option>
        </select>
    </div>
    <p id="status" style="margin:0.3rem 0;font-size:0.85rem;color:#888;">Initializing WebGPU...</p>
    <div class="controls">
        <span class="slider-group">
            <label for="alpha">Amplify</label>
            <input type="range" id="alpha" min="1" max="200" value="30" step="1">
            <span id="alpha-val">30&times;</span>
        </span>
        <span class="slider-group">
            <label for="freq-center">Center Hz</label>
            <input type="range" id="freq-center" min="0.1" max="30" value="1.75" step="0.05">
            <span id="freq-center-val">1.75</span>
        </span>
        <span class="slider-group">
            <label for="freq-bw">BW Hz</label>
            <input type="range" id="freq-bw" min="0.2" max="15" value="2.5" step="0.1">
            <span id="freq-bw-val">2.5</span>
        </span>
    </div>
    <div class="controls">
        <button id="toggle">Pause</button>
        <button id="copy-log">Copy Log</button>
    </div>
    <div id="debug-log"></div>

    <script type="module">
        const debugEl = document.getElementById('debug-log');
        const BUILD_VERSION = "@@BUILD_VERSION@@";
        const MAX_LOG_LINES = 200;
        const logLines = [`[build] v${BUILD_VERSION}`];
        function dbg(msg) {
            const ts = new Date().toISOString().slice(11, 23);
            logLines.push(`[${ts}] ${msg}`);
            if (logLines.length > MAX_LOG_LINES) logLines.splice(0, logLines.length - MAX_LOG_LINES);
            debugEl.textContent = logLines.join('\n');
            debugEl.scrollTop = debugEl.scrollHeight;
        }
        for (const lvl of ['log','info','warn','error']) {
            const orig = console[lvl].bind(console);
            console[lvl] = (...a) => { orig(...a); dbg(`[${lvl}] ${a.map(x => { try { return typeof x==='object'?JSON.stringify(x):String(x); } catch{return String(x);} }).join(' ')}`); };
        }
        window.addEventListener('error', e => dbg(`[UNCAUGHT] ${e.message} at ${e.filename}:${e.lineno}`));
        window.addEventListener('unhandledrejection', e => dbg(`[UNHANDLED] ${e.reason}`));

        document.getElementById('copy-log').addEventListener('click', () => {
            navigator.clipboard.writeText(logLines.join('\n')).then(
                () => { document.getElementById('copy-log').textContent = 'Copied!'; setTimeout(() => document.getElementById('copy-log').textContent = 'Copy Log', 1500); },
                () => {}
            );
        });

        // ── Camera enumeration ──
        // Store facing mode info for each camera
        const cameraFacing = {};
        async function populateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter(d => d.kind === 'videoinput');
                const sel = document.getElementById('camera');
                sel.innerHTML = '';
                cams.forEach((cam, i) => {
                    const opt = document.createElement('option');
                    opt.value = cam.deviceId;
                    const label = cam.label || `Camera ${i + 1}`;
                    opt.textContent = label;
                    sel.appendChild(opt);
                    // Guess facing mode from label
                    const lo = label.toLowerCase();
                    if (lo.includes('back') || lo.includes('rear') || lo.includes('environment')) {
                        cameraFacing[cam.deviceId] = 'environment';
                    } else if (lo.includes('front') || lo.includes('user') || lo.includes('facing front')) {
                        cameraFacing[cam.deviceId] = 'user';
                    }
                });
                dbg(`Found ${cams.length} camera(s), facing: ${JSON.stringify(cameraFacing)}`);
            } catch (e) {
                dbg(`Camera enumeration failed: ${e}`);
            }
        }

        // ── Main init ──
        async function init() {
            const status = document.getElementById('status');
            dbg('Page loaded, checking WebGPU...');
            dbg(`navigator.gpu: ${!!navigator.gpu}`);

            if (!navigator.gpu) {
                status.textContent = 'WebGPU not supported. Try Chrome 113+.';
                status.classList.add('error');
                return;
            }

            try {
                dbg('Importing WASM module...');
                const wasm = await import('./motion_mag_webgpu.js');
                dbg('Calling WASM default()...');
                await wasm.default();
                dbg('WASM initialized.');

                // Set canvas aspect from detected camera resolution
                if (window.__mamp_aspect) {
                    const canvas = document.getElementById('output');
                    canvas.style.aspectRatio = String(window.__mamp_aspect);
                    dbg(`Aspect ratio: ${window.__mamp_aspect.toFixed(3)}`);
                }

                status.textContent = 'Running';

                // Toggle fullscreen on canvas click
                document.getElementById('output').addEventListener('click', () => {
                    const el = document.getElementById('output');
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        el.requestFullscreen().catch(() => {});
                    }
                });

                // Enumerate cameras now that permission is granted
                await populateCameras();
                updateResOptions();

                // Camera switch — pass facing mode if known (more reliable than deviceId on mobile)
                document.getElementById('camera').addEventListener('change', async (e) => {
                    const deviceId = e.target.value;
                    const facing = cameraFacing[deviceId] || '';
                    dbg(`Switching to camera: ${deviceId} facing=${facing || 'unknown'}`);
                    try {
                        await wasm.start_with_camera(deviceId, facing);
                        if (window.__mamp_aspect) {
                            document.getElementById('output').style.aspectRatio = String(window.__mamp_aspect);
                        }
                        updateResOptions();
                        dbg('Camera switched.');
                    } catch (err) {
                        dbg(`Camera switch failed: ${err}`);
                    }
                });

                // Amplification slider
                const slider = document.getElementById('alpha');
                const alphaVal = document.getElementById('alpha-val');
                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    alphaVal.textContent = v + '\u00d7';
                    if (window.setMagnification) window.setMagnification(v);
                });

                // Frequency sliders (center + bandwidth → low/high)
                const freqCenter = document.getElementById('freq-center');
                const freqCenterVal = document.getElementById('freq-center-val');
                const freqBw = document.getElementById('freq-bw');
                const freqBwVal = document.getElementById('freq-bw-val');

                function updateFreqs() {
                    const c = parseFloat(freqCenter.value);
                    let bw = parseFloat(freqBw.value);
                    const low = Math.max(0.01, c - bw / 2);
                    const high = c + bw / 2;
                    freqCenterVal.textContent = c.toFixed(2);
                    freqBwVal.textContent = bw.toFixed(1);
                    if (window.setFreqLow) window.setFreqLow(low);
                    if (window.setFreqHigh) window.setFreqHigh(high);
                }
                freqCenter.addEventListener('input', updateFreqs);
                freqBw.addEventListener('input', updateFreqs);
                updateFreqs();

                // Rebuild resolution dropdown: show widths where FFT pad size changes
                function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }
                function updateResOptions() {
                    const camMax = window.__mamp_cam_max || window.__mamp_cam_w || 640;
                    const camW = window.__mamp_cam_w || 640;
                    const camH = window.__mamp_cam_h || 480;
                    const aspect = camH / camW; // h/w ratio (>1 in portrait)
                    const sel = document.getElementById('resolution');
                    const cur = sel.value;

                    // For each power-of-2 pad width, find the max processing width
                    // that fits. Only include if camera supports it.
                    const options = [];
                    for (const padW of [128, 256, 512, 1024, 2048]) {
                        const w = padW; // max width that pads to padW
                        if (w > camMax) break;
                        const h = Math.round(w * aspect);
                        const padH = nextPow2(h);
                        const pixels = padW * padH;
                        const label = `${w} (${pixels >= 1048576 ? (pixels / 1048576).toFixed(1) + 'M' : Math.round(pixels / 1024) + 'K'})`;
                        options.push({ value: w, label });
                    }

                    sel.innerHTML = '';
                    options.forEach(({ value, label }) => {
                        const opt = document.createElement('option');
                        opt.value = value;
                        opt.textContent = label;
                        if (String(value) === cur) opt.selected = true;
                        sel.appendChild(opt);
                    });
                    // Select the option closest to actual processing width
                    const procW = window.__mamp_proc_w || window.__mamp_cam_w || 640;
                    const best = options.filter(o => o.value <= procW).pop() || options[0];
                    if (best) sel.value = best.value;
                }

                // Resolution selector (async — restarts camera at matching resolution)
                document.getElementById('resolution').addEventListener('change', async (e) => {
                    const maxW = parseInt(e.target.value, 10);
                    dbg(`Setting resolution: ${maxW}p`);
                    try {
                        await wasm.set_resolution(maxW);
                        updateResOptions();
                    } catch (err) {
                        dbg(`Resolution change failed: ${err}`);
                    }
                });

                // Quality selector (scales × orientations)
                document.getElementById('quality').addEventListener('change', (e) => {
                    const [s, o] = e.target.value.split(',').map(Number);
                    dbg(`Setting quality: ${s} scales × ${o} orientations`);
                    if (window.setQuality) window.setQuality(s, o);
                });

                // Pause/resume
                document.getElementById('toggle').addEventListener('click', function() {
                    if (window.toggleMagnification) window.toggleMagnification();
                    this.textContent = this.textContent === 'Pause' ? 'Resume' : 'Pause';
                });

                // FPS display (frequency slider max is fixed)
                setInterval(() => {
                    const fps = window.__mamp_fps;
                    const res = window.__mamp_res || '';
                    const paused = document.getElementById('toggle').textContent === 'Resume';
                    const state = paused ? 'Paused' : 'Running';
                    if (typeof fps === 'number' && fps > 0) {
                        status.textContent = `${state} — ${Math.round(fps)} fps ${res}`;
                    } else {
                        status.textContent = state;
                    }
                }, 1000);

            } catch (e) {
                status.textContent = `Error: ${e.message || e}`;
                status.classList.add('error');
                dbg(`[CATCH] ${e.message || e}`);
                dbg(`[STACK] ${e.stack || 'n/a'}`);
            }
        }

        init();
    </script>
</body>
</html>
