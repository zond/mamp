[package]
name = "motion-mag-webgpu"
version = "0.1.0"
edition = "2021"
description = "Real-time video motion magnification via WebGPU (Ha et al. 2024 architecture)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
wgpu = { version = "0.19", features = ["webgl"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
    "CanvasRenderingContext2d",
    "VideoTrack",
    "GpuDevice",
    "GpuAdapter",
    "GpuQueue",
    "OffscreenCanvas",
    "ImageBitmap",
    "HtmlImageElement",
    "Performance",
]

[profile.release]
opt-level = "s"
lto = true
