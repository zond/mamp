name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (recent wasm-opt)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_121/bin" >> $GITHUB_PATH

      - name: Build WASM (wasm-pack's wasm-opt disabled in Cargo.toml)
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Optimize WASM with recent wasm-opt
        run: wasm-opt pkg/motion_mag_webgpu_bg.wasm -O -o pkg/motion_mag_webgpu_bg.wasm --all-features

      - name: Copy index.html to pkg with git version
        run: |
          VERSION=$(git describe --always --dirty)
          sed "s/@@BUILD_VERSION@@/$VERSION/" index.html > pkg/index.html

      - name: Copy weights to pkg (if present)
        run: |
          if [ -d weights ]; then
            cp -r weights pkg/weights
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pkg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
